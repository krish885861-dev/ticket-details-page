<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile &amp; Account related issue - Ticket ID: 500014181477</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">
    <!-- Top Navigation Header -->
    <header class="chat-header">
      <div class="chat-header-inner">
        <button type="button" id="backBtn" class="back-btn" aria-label="Go back" title="Back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <div class="header-text">
          <h1 class="header-title">Profile &amp; Account related issue</h1>
          <div id="ticketMetaDisplay" class="header-subtitle-row">
            <p class="header-subtitle" id="ticketSubtitle">Ticket ID: 500014181477, 14 Oct</p>
            <button type="button" id="editTicketMetaBtn" class="inline-edit-icon-btn hidden"
              aria-label="Edit Ticket ID and date" title="Edit Ticket ID and date">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
          </div>
          <div id="ticketMetaEditor" class="inline-meta-editor hidden">
            <label for="editTicketIdInput" class="sr-only">Ticket ID</label>
            <input type="text" id="editTicketIdInput" class="inline-meta-input inline-meta-input--id"
              placeholder="Ticket ID" />
            <label for="editTicketDateInput" class="sr-only">Ticket Date</label>
            <input type="text" id="editTicketDateInput" class="inline-meta-input inline-meta-input--date"
              placeholder="Date (e.g. 14 Oct)" />
            <button type="button" id="saveTicketMetaBtn" class="btn-primary btn-xs">Save</button>
            <button type="button" id="cancelTicketMetaBtn" class="btn-secondary btn-xs">Cancel</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Scrollable Conversation Area -->
    <main id="chatStream" class="chat-stream" aria-label="Support conversation">
      <div class="chat-stream-inner" id="chatMessagesContainer">
        <!-- Date Separator -->
        <div class="date-separator">
          <div id="chatDateDisplay" class="date-separator-display">
            <span id="chatDateText">Wed, 14/10</span>
            <button type="button" id="editChatDateBtn" class="inline-edit-icon-btn hidden"
              aria-label="Edit conversation date" title="Edit date">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
          </div>
          <div id="chatDateEditor" class="inline-meta-editor hidden">
            <label for="editChatDateInput" class="sr-only">Conversation Date</label>
            <input type="text" id="editChatDateInput" class="inline-meta-input inline-meta-input--date"
              placeholder="e.g. Wed, 14/10" />
            <button type="button" id="saveChatDateBtn" class="btn-primary btn-xs">Save</button>
            <button type="button" id="cancelChatDateBtn" class="btn-secondary btn-xs">Cancel</button>
          </div>
        </div>

        <!-- Original Support Message Card (Editable) -->
        <article class="message-row message-row--incoming" id="originalMessageRow">
          <div class="message-card" id="originalMessageCard">
            <button type="button" id="editMessageBtn" class="edit-msg-btn hidden" aria-label="Edit message"
              title="Edit message">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span>Edit</span>
            </button>

            <!-- Rendered Message Content -->
            <div id="originalMessageBody" class="message-body"></div>

            <!-- Inline Edit Mode -->
            <div id="originalMessageEditor" class="message-editor hidden">
              <label for="editMessageTextarea" class="sr-only">Edit support message</label>
              <textarea id="editMessageTextarea" class="edit-textarea" rows="14" spellcheck="true"></textarea>
              <div class="edit-actions">
                <button type="button" id="cancelEditBtn" class="btn-secondary">Cancel</button>
                <button type="button" id="saveEditBtn" class="btn-primary">Save</button>
              </div>
            </div>
          </div>
        </article>

        <!-- Dynamic User Replies Render Here -->
        <div id="repliesContainer" class="replies-container"></div>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Bottom Message Composer -->
    <footer class="composer-bar">
      <div class="composer-inner">
        <!-- Pending Attachment Preview -->
        <div id="attachmentPreview" class="attachment-preview hidden"></div>

        <form id="composerForm" class="composer-row" autocomplete="off">
          <div class="composer-input-pill">
            <label for="messageInput" class="sr-only">Send Message</label>
            <textarea id="messageInput" class="composer-textarea" placeholder="Send Message" rows="1"></textarea>

            <input type="file" id="fileInput" class="sr-only" accept="image/*,.pdf,.doc,.docx,.txt" multiple />
            <input type="file" id="cameraInput" class="sr-only" accept="image/*" capture="environment" />

            <button type="button" id="attachBtn" class="composer-icon-btn" aria-label="Attach file" title="Attach file">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                </path>
              </svg>
            </button>

            <button type="button" id="cameraBtn" class="composer-icon-btn" aria-label="Take or upload photo"
              title="Camera">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </button>
          </div>

          <button type="button" id="micBtn" class="composer-mic-btn" aria-label="Voice message" title="Voice message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button type="submit" id="sendBtn" class="composer-send-btn hidden" aria-label="Send message"
            title="Send message">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
      <!-- Safety / Demonstration Notice -->
      <div class="demo-footer-note" role="note" aria-label="Demonstration notice">
        Demonstration &amp; UI Recreation for incident documentation — not an authentic Paytm, Razorpay, or
        payment-provider page.
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
